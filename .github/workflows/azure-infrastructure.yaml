name: Deploy Azure Data Store

on:
  workflow_dispatch:
    inputs:
      resourceGroup:
        description: Azure resource group
        required: true
        default: rg-housing-cicd
      storageAccountName:
        description: Globally unique lowercase storage account name
        required: true
      location:
        description: Azure region
        required: true
        default: indonesiacentral

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Storage Account and Blob Container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Bicep resources
        uses: azure/cli@v2
        with:
          inlineScript: |
            az group create \
              --name "${{ inputs.resourceGroup }}" \
              --location "${{ inputs.location }}"
            az deployment group create \
              --resource-group "${{ inputs.resourceGroup }}" \
              --template-file infra/main.bicep \
              --parameters storageAccountName="${{ inputs.storageAccountName }}"
